name: Daily refresh

on:
  schedule:
    - cron: "30 12 * * *"   # 12:30 UTC = 7:30 AM EST / 8:30 AM EDT
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install openpyxl==3.1.5 tzdata

      - name: Pull sheet and compute
        run: python fetch_data.py

      - name: Build page
        run: python build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily refresh $(date -u +'%Y-%m-%d')"
            git push
          fi
